name: Build release zip

# Publishes an install-ready plugin zip to the Releases page whenever a version
# tag (vX.Y.Z) is pushed. To cut a release:
#
#   git tag v3.3.1 && git push origin v3.3.1
#
# The job packages a correctly-named `ai-seo-assistant/` folder that includes the
# Composer autoloader and excludes dev files, so the attached zip installs on any
# WordPress site with no build step. It uses only tools pre-installed on the
# runner plus the pinned first-party actions/checkout, to minimise supply-chain risk.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Stage the plugin folder
        run: |
          mkdir -p build/ai-seo-assistant
          rsync -a ./ build/ai-seo-assistant/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='node_modules' \
            --exclude='build' \
            --exclude='*.zip' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.gitignore'

      - name: Create the zip
        run: |
          cd build
          zip -rq ../ai-seo-assistant.zip ai-seo-assistant

      - name: Publish the release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ai-seo-assistant.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" ai-seo-assistant.zip --clobber
