name: CI

on:
  push:
    branches: [main]
  # Every PR, stacked ones too (Andrew, 2026-10-06): a PR into a feature branch is checked as well.
  pull_request:

jobs:
  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      # Ratchet: phpcs.xml lists the modules held to WPCS (src/Report from 4.3.0); older
      # modules join as they are cleaned.
      - name: Run PHPCS
        run: ./vendor/bin/phpcs

      # strip_shortcodes() deletes a builder module's whole text (Divi pages read as empty): only with
      # "// builder-safe: <reason>" on its line.
      - name: Builder-safe text check
        run: php bin/check-builder-safe.php

      # A write to the plugin's tables must follow Schema::ensure() in its function (an update that skipped
      # install() would write a column that is not there yet), unless the line says
      # "// schema-guard: <reason>".
      - name: Schema-guard check
        run: php bin/check-schema-guard.php

  phpunit:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.0 = declared minimum (plugin header); 8.3/8.4 = what the dev and live sites run.
        php: ['8.0', '8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit

      - name: Run the script tests (node's built-in runner, no dependencies)
        run: node --test tests/js/*.test.mjs
